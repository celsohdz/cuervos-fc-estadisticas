<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo-cuervos.png">
  <meta name="description" content="Portal oficial de los equipos Cuervos.">
  <meta name="theme-color" content="#080a0f">
  <title>Cuervos · Selecciona tu equipo</title>
  <link rel="stylesheet" href="portal.css?v=20260920-1">
</head>
<body class="portal-page">
  <main class="portal-shell">
    <section class="portal-intro" aria-labelledby="portal-title">
      <header class="portal-heading">
        <p class="portal-eyebrow">Familia Cuervos</p>
        <h1 id="portal-title">Elige tu equipo</h1>
        <p>Resultados, estadísticas y toda la actividad de la parvada.</p>
      </header>
      <figure class="portal-photo">
        <img src="assets/equipo-cuervos.jpg" alt="Jugadores de Cuervos FC y Cuervos JR reunidos en la cancha">
        <figcaption><strong>Una sola parvada.</strong> Dos generaciones, los mismos colores.</figcaption>
      </figure>
    </section>

    <section class="team-grid" aria-label="Equipos Cuervos">
      <a class="team-card team-card-fc" href="cuervos-fc.html">
        <span class="team-crest">
          <img src="assets/logo-cuervos.png" alt="Escudo de Cuervos FC">
        </span>
        <span class="team-copy">
          <small>Equipo Master</small>
          <strong>Cuervos FC</strong>
          <span>Entrar al sitio <b aria-hidden="true">→</b></span>
        </span>
      </a>

      <a class="team-card team-card-jr" href="cuervos-jr.html">
        <span class="team-crest team-crest-jr">
          <img src="assets/logo-cuervos.png" alt="Escudo de Cuervos JR">
          <b>JR</b>
        </span>
        <span class="team-copy">
          <small>Nueva generación</small>
          <strong>Cuervos JR</strong>
          <span>Conocer el equipo <b aria-hidden="true">→</b></span>
        </span>
      </a>
    </section>

    <footer class="portal-footer">CUERVOS <span>FC</span> · Una sola parvada</footer>
  </main>
</body>
</html>
